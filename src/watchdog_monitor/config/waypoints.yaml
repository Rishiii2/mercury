waypoint_detector_node:
  ros__parameters:
    spawn_x: 26.15
    spawn_y: -18.5
    waypoints: [26.32, -20.5,  26.29, -24.5,  25.75, -28.5]  # aligned with south heading at spawn
    waypoint_names: ["WP-1", "WP-2", "WP-3"]
    arrival_radius: 0.5

    # How often to publish /waypoint_status (seconds)
    status_interval: 1.0

    # Primary odometry topic
    odom_topic: "/odometry/filtered"
